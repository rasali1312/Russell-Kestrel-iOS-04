name: Russell Kestrel iOS 04

options:
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  RussellKestrel:
    type: application
    platform: iOS

    sources:
      - path: Russell Kestrel iOS 04

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.russell.kestrel.ios04
        PRODUCT_NAME: RussellKestrel
        INFOPLIST_FILE: Russell Kestrel iOS 04/Info.plist
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"

    scheme:
      gatherCoverageData: false
      testTargets: []
