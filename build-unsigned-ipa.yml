name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project 'RussellKestrel.xcodeproj' \
            -scheme 'RussellKestrel' \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/Release-iphoneos/RussellKestrel.app' -type d | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Russell-Kestrel-iOS-0.4-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Russell-Kestrel-iOS-0.4-unsigned-ipa
          path: Russell-Kestrel-iOS-0.4-unsigned.ipa
